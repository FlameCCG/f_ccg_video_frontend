<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili Video Platform</title>
    <link rel="stylesheet" href="/iconfront.css" />
    <style>
      /* Vue 接管页面前只保留克制的启动提示，不再伪造一整页内容骨架。 */
      :root {
        --boot-background: oklch(98.5% 0.004 240deg);
        --boot-surface: oklch(94.5% 0.009 240deg);
        --boot-brand: oklch(62% 0.17 230deg);
        --boot-text: oklch(42% 0.018 240deg);
      }

      html.dark {
        --boot-background: oklch(17% 0.01 250deg);
        --boot-surface: oklch(24% 0.012 250deg);
        --boot-brand: oklch(70% 0.14 230deg);
        --boot-text: oklch(78% 0.015 250deg);
      }

      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }

      body:has(> #app > .app-boot) {
        background: var(--boot-background);
      }

      .app-boot {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background: var(--boot-background);
      }

      .app-boot__indicator {
        display: flex;
        width: min(180px, calc(100% - 48px));
        flex-direction: column;
        gap: 10px;
        align-items: center;
        color: var(--boot-text);
        font:
          13px/1.4 system-ui,
          sans-serif;
        opacity: 0;
        animation: app-boot-reveal 160ms ease-out 180ms forwards;
      }

      .app-boot__track {
        position: relative;
        width: 100%;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-surface);
      }

      .app-boot__track::after {
        position: absolute;
        inset: 0;
        content: '';
        border-radius: inherit;
        background: var(--boot-brand);
        transform: translate3d(-72%, 0, 0) scaleX(0.28);
        transform-origin: left center;
        animation: app-boot-progress 1.1s ease-in-out infinite;
      }

      @keyframes app-boot-reveal {
        to {
          opacity: 1;
        }
      }

      @keyframes app-boot-progress {
        50% {
          transform: translate3d(72%, 0, 0) scaleX(0.52);
        }

        100% {
          transform: translate3d(260%, 0, 0) scaleX(0.28);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot__indicator {
          opacity: 1;
          animation: none;
        }

        .app-boot__track::after {
          transform: scaleX(0.42);
          animation: none;
        }
      }
    </style>
    <script>
      /*
       * 主题预置：在首次绘制之前把 html.dark 定下来。
       * 主题存在 pinia-plugin-persistedstate 的 localStorage['theme'] 里，
       * 但 store 要等 JS bundle 解析、app.mount 之后才应用 —— 中间这段时间
       * 页面会先按浅色渲染再整屏翻黑，这一下闪白是打开站点的第一印象。
       * 默认值与 stores/theme.ts 的 ref<Theme>('dark') 保持一致。
       */
      ;(function () {
        try {
          var raw = window.localStorage.getItem('theme')
          var theme = raw ? JSON.parse(raw).theme || 'dark' : 'dark'
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" role="status" aria-label="页面加载中">
        <div class="app-boot__indicator">
          <span>正在打开页面</span>
          <span class="app-boot__track" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
